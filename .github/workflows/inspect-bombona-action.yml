name: Inspect bombona action
on:
  push:
    branches:
      - inspect/bombona-action-20260915
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live shared view
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://lead-gestao.gabrielysilva27.workers.dev/api/shared-view' -o /tmp/live.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/live.json'))
          data=d.get('data') or d
          actions=data.get('actionPlans') or []
          matches=[]
          for a in actions:
              txt=' '.join(str(a.get(k,'')) for k in ('objective','title','meetingSubject','meetingTitle'))
              if 'bombona' in txt.lower() or ('nova rio' in txt.lower() and 'puxada' in txt.lower()):
                  matches.append(a)
          print('MATCH_COUNT',len(matches))
          for a in matches:
              print(json.dumps(a,ensure_ascii=False,sort_keys=True))
          PY
