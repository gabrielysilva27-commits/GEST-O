name: Test password reset central

on:
  push:
    branches:
      - fix/password-reset-central-20260915

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Syntax and markers
        run: |
          node --check assets/js/shared-api.js
          node --check assets/js/app.js
          node --check assets/js/modules/index.js
          node --check dist/server/index.js
          grep -q 'api/password-reset/request' dist/server/index.js
          grep -q 'api/password-reset/requests' dist/server/index.js
          grep -q 'passwordOverrides' dist/server/index.js
          grep -q 'Redefinição de senha' dist/server/index.js
