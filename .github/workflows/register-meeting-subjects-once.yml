name: Cadastrar reuniões e assuntos TOR DPO - execução única (retry)

on:
  push:
    branches: [main]
    paths: [".github/workflows/register-meeting-subjects-once.yml"]

permissions:
  contents: write
  actions: write

jobs:
  register-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cancelar deploy automático do commit temporário
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            run_id=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow deploy-worker.yml --commit "${GITHUB_SHA}" --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
            if [ -n "$run_id" ]; then gh run cancel "$run_id" --repo "${GITHUB_REPOSITORY}" || true; break; fi
            sleep 5
          done

      - name: Aplicar somente os cadastros da planilha
        run: |
          git checkout main
          git pull --ff-only origin main
          node scripts/register-meeting-subjects-once.mjs
          unexpected=$(git diff --name-only | grep -Ev '^(assets/js/api.js|assets/js/app.js|index.html|scripts/build-site.mjs|scripts/register-meeting-subjects-once.mjs|\.github/workflows/register-meeting-subjects-once.yml)$' || true)
          if [ -n "$unexpected" ]; then echo "$unexpected"; exit 1; fi
          npm run build

      - name: Registrar cadastros definitivos
        run: |
          git config user.name "gabrielysilva27-commits"
          git config user.email "gabrielysilva27@icloud.com"
          git add -A
          git commit -m "Cadastra assuntos TOR DPO e compartilha com usuários"
          git push origin main

      - name: Publicar LEAD no Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          secrets: |
            APP_SYNC_SECRET
          preCommands: npm run build
        env:
          APP_SYNC_SECRET: ${{ secrets.APP_SYNC_SECRET }}

      - name: Confirmar visibilidade compartilhada
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const source=fs.readFileSync("assets/js/api.js","utf8");
          const start=source.indexOf("const MEETING_TEMPLATES = ["),open=source.indexOf("[",start);
          let d=0,q=null,e=false,close=-1;
          for(let i=open;i<source.length;i++){const c=source[i];if(q){if(e)e=false;else if(c==="\\")e=true;else if(c===q)q=null;continue}if(c==='"'||c==="'"||c==="`"){q=c;continue}if(c==="[")d++;else if(c==="]"&&!--d){close=i;break}}
          const catalog=Function("return ("+source.slice(open,close+1)+")")().filter(x=>x.id>=2&&x.id<=17);
          let last;
          for(let attempt=0;attempt<12;attempt++){
            try{
              const r=await fetch("https://lead-gestao.gabrielysilva27.workers.dev/api/shared-view",{cache:"no-store"});
              if(!r.ok)throw Error("HTTP "+r.status);
              const p=await r.json(),meetings=p?.data?.meetings||[],missing=[];
              for(const expected of catalog){const actual=meetings.find(x=>x?.title===expected.title);if(!actual){missing.push(expected.title);continue}const set=new Set(actual.subjects||[]);for(const s of expected.subjects)if(!set.has(s))missing.push(expected.title+" :: "+s)}
              if(!missing.length){console.log("Catálogo compartilhado confirmado para todas as reuniões e assuntos TOR DPO.");process.exit(0)}
              last=Error("Faltam "+missing.length+" itens: "+missing.slice(0,5).join(" | "));
            }catch(err){last=err}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw last||Error("Falha de confirmação");
          NODE
