name: Verify temporary LEAD apt import
on:
  push:
    branches:
      - chatgpt-live-actions-snapshot-20260914
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production import
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            'https://lead-gestao.gabrielysilva27.workers.dev/api/shared-view' \
            --output live-shared-view.json
          node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('live-shared-view.json','utf8'));
          const actions=payload?.data?.actionPlans;
          if(!Array.isArray(actions)) throw new Error('actionPlans ausente');
          const batch=actions.filter(a=>a.legacyImportBatch==='aptas-20260914-v1');
          console.log(`TOTAL_ACTIONS=${actions.length}`);
          console.log(`APT_BATCH=${batch.length}`);
          const lucas=batch.filter(a=>String(a.legacyOwnerName||'').toLowerCase().includes('lucas soares')).length;
          const christofee=batch.filter(a=>String(a.legacyOwnerName||'').toLowerCase().includes('christof')).length;
          console.log(`LUCAS=${lucas}`);
          console.log(`CHRISTOFEE=${christofee}`);
          console.log('SAMPLES='+JSON.stringify(batch.slice(0,3).map(a=>({id:a.id,meetingTitle:a.meetingTitle,meetingSubject:a.meetingSubject,owner:a.legacyOwnerName,objective:a.objective}))));
          if(batch.length!==221) throw new Error(`esperado 221, encontrado ${batch.length}`);
          NODE
