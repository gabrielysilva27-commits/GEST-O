name: Aplicar GEROT ENTREGA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gerot-entrega-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Aplicar correções do GEROT ENTREGA
        run: node scripts/patch-gerot-entrega.mjs
      - name: Validar referência e build
        run: |
          node --input-type=module <<'NODE'
          const { GEROT_ENTREGA_REFERENCE } = await import('./assets/js/gerot-entrega-reference.js');
          const byRow = new Map(GEROT_ENTREGA_REFERENCE.rows.map(row => [row.sheetRow, row]));
          if (GEROT_ENTREGA_REFERENCE.area !== 'ENTREGA') throw new Error('Área incorreta');
          if (GEROT_ENTREGA_REFERENCE.rows.length !== 133) throw new Error('Quantidade de linhas inesperada');
          if (byRow.get(11)?.displayFormat !== '%') throw new Error('Atrasos - TML deve exibir percentual');
          if (byRow.get(16)?.formulas?.[1] !== '35*P8') throw new Error('Memória de dias úteis incorreta');
          if (byRow.get(20)?.formulas?.[6] !== 'IFERROR(U21/U22,"")') throw new Error('Devolução HL sem cálculo mensal');
          if (byRow.get(68)?.displayFormat !== 'HORA') throw new Error('Jornada líquida sem unidade de hora');
          if (byRow.get(114)?.formulas?.[6] !== 'IFERROR(U116/U115,"")') throw new Error('ON TIME com fórmula incorreta');
          if (byRow.get(120)?.formulas?.[6] !== 'IFERROR(U122/U121,"")') throw new Error('OTIF Food Service com fórmula incorreta');
          console.log('VALIDATED GEROT ENTREGA:', GEROT_ENTREGA_REFERENCE.rows.length, 'linhas');
          NODE
          npm run build
          node --check dist/server/index.js
      - name: Remover aplicador temporário
        run: rm -f scripts/patch-gerot-entrega.mjs .github/workflows/gerot-entrega-once.yml
      - name: Publicar correção no repositório
        run: |
          git config user.name "gabrielysilva27-commits"
          git config user.email "gabrielysilva27@icloud.com"
          git add -A
          git commit -m "Aprimora GEROT ENTREGA conforme planilha"
          git push origin main
