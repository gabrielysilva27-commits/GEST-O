name: Importar ações padronizadas - execução única

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-actions-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cancelar deploy automático deste commit temporário
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            run_id=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow deploy-worker.yml --commit "${GITHUB_SHA}" --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
            if [ -n "$run_id" ]; then
              gh run cancel "$run_id" --repo "${GITHUB_REPOSITORY}" || true
              break
            fi
            sleep 5
          done

      - name: Atualizar main e aplicar somente a importação
        shell: bash
        run: |
          git checkout main
          git pull --ff-only origin main
          node scripts/import-actions-once.mjs

      - name: Registrar importação definitiva
        shell: bash
        run: |
          git config user.name "gabrielysilva27-commits"
          git config user.email "gabrielysilva27@icloud.com"
          git add -A
          git commit -m "Importa ações padronizadas elegíveis"
          git push origin main

      - name: Publicar LEAD no Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          secrets: |
            APP_SYNC_SECRET
          preCommands: npm run build
        env:
          APP_SYNC_SECRET: ${{ secrets.APP_SYNC_SECRET }}
