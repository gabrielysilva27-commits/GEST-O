name: Finalizar GEROT ENTREGA

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gerot-entrega-finalize.yml'
      - 'scripts/gerot-entrega-finalize.mjs'

permissions:
  contents: write

concurrency:
  group: lead-production
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Aplicar correções do GEROT ENTREGA
        run: node scripts/gerot-entrega-finalize.mjs

      - name: Validar código e build
        run: |
          node --check assets/js/app.js
          node --check assets/js/modules/index.js
          node - <<'NODE'
          import { IMPORTED_GEROT_AREAS } from './assets/js/gerot-imports.js';
          const area = IMPORTED_GEROT_AREAS.find((item) => item.area === 'ENTREGA');
          if (!area || !Array.isArray(area.rows) || area.rows.length < 126) throw new Error('ENTREGA incompleto');
          const rows = new Map(area.rows.map((row) => [row.id, row]));
          const required = ['entrega-8','entrega-11','entrega-12','entrega-13','entrega-16','entrega-40','entrega-114','entrega-140'];
          for (const id of required) if (!rows.has(id)) throw new Error(`Linha ausente: ${id}`);
          if (rows.get('entrega-11').unit !== '%' || rows.get('entrega-12').unit !== '%' || rows.get('entrega-13').unit !== '%') throw new Error('Unidades percentuais incorretas');
          if (rows.get('entrega-40').unit !== 'PPM') throw new Error('DQI sem PPM');
          if (!rows.get('entrega-16').formulas?.[0]?.includes('O8')) throw new Error('Dias úteis não vinculados');
          if (!/U116\/U115/.test(rows.get('entrega-114').formulas?.[6] || '')) throw new Error('ON TIME JUL incorreto');
          if (Number(rows.get('entrega-140').eoy2025) > 1.5) throw new Error('NPS EOY 2025 não normalizado');
          console.log('ENTREGA_VALIDADO', area.rows.length);
          NODE
          grep -q 'data-gerot-format' assets/js/modules/index.js
          grep -q 'function parseGerotInput' assets/js/app.js
          grep -q 'GEROT ENTREGA spreadsheet refinement 2026-09-06' assets/css/styles.css
          npm run build
          node scripts/test-dto.mjs
          node tests/action-owner.test.mjs
          node tests/database-storage.test.mjs
          node tests/anomaly-items.test.mjs
          node --check dist/server/index.js

      - name: Registrar versão final
        run: |
          git config user.name "gabrielysilva27-commits"
          git config user.email "gabrielysilva27@icloud.com"
          git add -A
          git commit -m "Corrige GEROT ENTREGA conforme planilha"
          git push origin main

      - name: Publicar Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          preCommands: npm run build && node --check dist/server/index.js

      - name: Confirmar publicação do GEROT ENTREGA
        run: |
          set -e
          BASE="https://lead-gestao.gabrielysilva27.workers.dev"
          for n in 1 2 3 4 5 6; do
            if curl -fsS "$BASE/assets/js/gerot-imports.js" -o /tmp/gerot.js; then break; fi
            sleep 5
          done
          grep -q '"id":"entrega-8"' /tmp/gerot.js
          grep -q '"id":"entrega-40".*"unit":"PPM"' /tmp/gerot.js
          curl -fsS "$BASE/assets/js/modules/index.js" -o /tmp/modules.js
          grep -q 'data-gerot-format' /tmp/modules.js
          curl -fsS "$BASE/assets/js/app.js" -o /tmp/app.js
          grep -q 'parseGerotInput' /tmp/app.js
          echo "GEROT ENTREGA publicado e confirmado."
