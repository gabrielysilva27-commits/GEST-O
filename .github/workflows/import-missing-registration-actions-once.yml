name: Importar ações após cadastro - execução única

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-missing-registration-actions-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cancelar deploy automático do commit temporário
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            run_id=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow deploy-worker.yml --commit "${GITHUB_SHA}" --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
            if [ -n "$run_id" ]; then
              gh run cancel "$run_id" --repo "${GITHUB_REPOSITORY}" || true
              break
            fi
            sleep 5
          done

      - name: Validar catálogo e preparar somente as ações elegíveis
        shell: bash
        run: |
          git checkout main
          git pull --ff-only origin main
          node --check scripts/import-missing-registration-actions-once.mjs
          node scripts/import-missing-registration-actions-once.mjs
          npm run build

      - name: Registrar importação definitiva
        shell: bash
        run: |
          rm -f .github/workflows/import-missing-registration-actions-once.yml
          rm -f scripts/import-missing-registration-actions-once.mjs
          rm -f scripts/import-payload-01.txt scripts/import-payload-02.txt scripts/import-payload-03.txt scripts/import-payload-04.txt
          unexpected=$(git status --short | awk '{print $2}' | grep -Ev '^(scripts/build-site\.mjs|scripts/shared-action-import-20260904\.mjs|scripts/import-missing-registration-actions-once\.mjs|scripts/import-payload-[0-9][0-9]\.txt|\.github/workflows/import-missing-registration-actions-once\.yml)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Arquivos inesperados alterados:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "gabrielysilva27-commits"
          git config user.email "gabrielysilva27@icloud.com"
          git add -A
          git commit -m "Importa ações elegíveis após cadastro de assuntos"
          git push origin main

      - name: Publicar LEAD no Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          secrets: |
            APP_SYNC_SECRET
          preCommands: npm run build
        env:
          APP_SYNC_SECRET: ${{ secrets.APP_SYNC_SECRET }}

      - name: Confirmar importação no ambiente publicado
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const moduleUrl = new URL("./scripts/shared-action-import-20260904.mjs", `file://${process.cwd()}/`);
          const { SHARED_ACTION_IMPORT_20260904: expected } = await import(moduleUrl.href + `?v=${Date.now()}`);
          const expectedKeys = new Set(expected.map((item) => String(item.importKey)));
          let last;
          for (let attempt=0; attempt<18; attempt++) {
            try {
              const response = await fetch(`https://lead-gestao.gabrielysilva27.workers.dev/api/shared-view?verify=${Date.now()}`, {cache:"no-store"});
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const payload = await response.json();
              const actions = Array.isArray(payload?.data?.actionPlans) ? payload.data.actionPlans : [];
              const batch = actions.filter((item) => item?.legacyImportBatch === "missing-registration-retry-20260904");
              const batchKeys = new Set(batch.map((item) => String(item?.legacyImportKey || "")));
              const missing = [...expectedKeys].filter((key) => !batchKeys.has(key));
              if (batch.length === expected.length && missing.length === 0) {
                const result = JSON.parse(fs.readFileSync("/tmp/import-result.json", "utf8"));
                result.verified = true;
                result.publishedCount = batch.length;
                fs.writeFileSync("/tmp/import-result.json", JSON.stringify(result, null, 2));
                console.log(`CONFIRMED: ${batch.length} ações publicadas e visíveis no compartilhamento.`);
                process.exit(0);
              }
              last = new Error(`Esperadas ${expected.length}; encontradas ${batch.length}; chaves faltantes ${missing.length}`);
            } catch (error) {
              last = error;
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          throw last || new Error("Falha de confirmação da importação");
          NODE

      - name: Salvar resultado da importação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-importacao-acoes-cadastro
          path: /tmp/import-result.json
          if-no-files-found: ignore
