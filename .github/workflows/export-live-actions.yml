name: Exportar ações atuais do LEAD

on:
  push:
    branches:
      - tmp-export-actions-20260913d

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exportar ações públicas atuais
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            https://lead-gestao.gabrielysilva27.workers.dev/api/shared-view \
            | jq '.data.actionPlans // []' > lead-actions.json
          echo "Ações exportadas: $(jq 'length' lead-actions.json)"
      - name: Disponibilizar exportação
        uses: actions/upload-artifact@v4
        with:
          name: lead-actions-live
          path: lead-actions.json
          if-no-files-found: error
          retention-days: 1
