name: Verify RPS Ocupação live
on:
  push:
    branches:
      - fix/rps-distribuicao-ocupacao-20260915
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir cadastro publicado
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 'https://lead-gestao.gabrielysilva27.workers.dev/api/shared-view' -o /tmp/shared.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/shared.json','utf8'));
          const meetings = payload?.data?.meetings || [];
          const norm = (v) => String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
          const meeting = meetings.find((m) => norm(m.title) === 'rps distribuicao');
          if (!meeting) throw new Error('RPS Distribuição não encontrada na produção.');
          const subjects = Array.isArray(meeting.subjects) ? meeting.subjects : [];
          const ocupacao = subjects.find((s) => norm(s) === 'ocupacao');
          if (!ocupacao) throw new Error('Assunto Ocupação ainda não aparece na RPS Distribuição.');
          console.log(JSON.stringify({meeting: meeting.title, subject: ocupacao, totalSubjects: subjects.length}));
          NODE
