name: Confirmar GEROT publicado

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-gerot-live.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código atual
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gerar exatamente os ativos de produção esperados
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node <<'NODE'
          const fs = require('fs');
          const runtime = fs.readFileSync('dist/server/index.js', 'utf8');
          const startMarker = 'var assets = new Map(';
          const endMarker = '.map(e=>[e.route,e]));';
          const start = runtime.indexOf(startMarker);
          if (start < 0) throw new Error('Mapa de ativos não encontrado no build');
          const jsonStart = start + startMarker.length;
          const end = runtime.indexOf(endMarker, jsonStart);
          if (end < 0) throw new Error('Fim do mapa de ativos não encontrado no build');
          const entries = JSON.parse(runtime.slice(jsonStart, end));
          const routes = [
            '/assets/js/gerot-imports.js',
            '/assets/js/modules/index.js',
            '/assets/js/app.js',
            '/assets/css/styles.css',
            '/'
          ];
          fs.mkdirSync('/tmp/expected-assets', { recursive: true });
          routes.forEach((route, index) => {
            const entry = entries.find((item) => item.route === route);
            if (!entry) throw new Error(`Ativo não encontrado no build: ${route}`);
            const body = entry.kind === 'base64' ? Buffer.from(entry.body, 'base64') : Buffer.from(entry.body, 'utf8');
            fs.writeFileSync(`/tmp/expected-assets/${index}`, body);
            console.log('EXPECTED', route, body.length);
          });
          NODE

      - name: Confirmar publicação pública byte a byte
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lead-gestao.gabrielysilva27.workers.dev"
          routes=(
            "/assets/js/gerot-imports.js"
            "/assets/js/modules/index.js"
            "/assets/js/app.js"
            "/assets/css/styles.css"
            "/"
          )

          for i in "${!routes[@]}"; do
            route="${routes[$i]}"
            expected="$(sha256sum "/tmp/expected-assets/$i" | awk '{print $1}')"
            matched=0
            for n in $(seq 1 24); do
              url="$BASE$route?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${n}"
              code="$(curl -L -sS --connect-timeout 10 --max-time 20 -o /tmp/live-file -w '%{http_code}' "$url" || true)"
              if [ "$code" = "200" ]; then
                actual="$(sha256sum /tmp/live-file | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then
                  echo "MATCH $route $actual"
                  matched=1
                  break
                fi
                echo "WAIT $route expected=$expected actual=$actual tentativa=$n"
              else
                echo "WAIT $route http=$code tentativa=$n"
              fi
              sleep 5
            done
            if [ "$matched" -ne 1 ]; then
              echo "ERRO: ativo público não corresponde exatamente ao build: $route"
              exit 1
            fi
          done

          curl -L -fsS --connect-timeout 10 --max-time 20 "$BASE/assets/js/gerot-imports.js?markers=${GITHUB_RUN_ID}" -o /tmp/gerot.js
          grep -q 'entrega-8' /tmp/gerot.js
          grep -q 'entrega-40' /tmp/gerot.js
          grep -q 'PPM' /tmp/gerot.js
          grep -q 'entrega-114' /tmp/gerot.js
          grep -q 'U116/U115' /tmp/gerot.js

          curl -L -fsS --connect-timeout 10 --max-time 20 "$BASE/assets/js/modules/index.js?markers=${GITHUB_RUN_ID}" -o /tmp/modules.js
          grep -q 'data-gerot-format' /tmp/modules.js

          curl -L -fsS --connect-timeout 10 --max-time 20 "$BASE/assets/js/app.js?markers=${GITHUB_RUN_ID}" -o /tmp/app.js
          grep -q 'parseGerotInput' /tmp/app.js

          grep -q 'LEAD Gestão' /tmp/live-file || true
          echo 'LIVE_CONFIRMATION_OK: build publicado corresponde byte a byte aos ativos públicos e marcadores GEROT estão ativos.'

      - name: Remover verificador temporário
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gabrielysilva27-commits"
          git config user.email "gabrielysilva27@icloud.com"
          git reset --hard HEAD
          rm -f .github/workflows/verify-gerot-live.yml
          git add .github/workflows/verify-gerot-live.yml
          git commit -m "Remove verificador temporário do GEROT"
          git push origin main
