name: Export temporary LEAD live actions snapshot

on:
  push:
    branches:
      - chatgpt-live-actions-snapshot-20260914

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch live shared view
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            'https://lead-gestao.gabrielysilva27.workers.dev/api/shared-view' \
            --output live-shared-view.json

      - name: Validate snapshot
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('live-shared-view.json', 'utf8'));
          const actions = payload?.data?.actionPlans;
          if (!Array.isArray(actions)) throw new Error('actionPlans ausente no snapshot');
          if (actions.length < 1000) throw new Error(`snapshot inesperadamente pequeno: ${actions.length}`);
          console.log(`Ações no snapshot: ${actions.length}`);
          NODE

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: lead-live-actions-snapshot
          path: live-shared-view.json
          retention-days: 1
