name: Aplicar editor GEROT em planilha

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gerot-sheet-editor-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código atual
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Aplicar editor e correções de cálculo
        run: |
          node scripts/patch-gerot-sheet-editor.mjs
          sed -i 's/EOY 2023/EOY 2024/g' assets/js/app.js

      - name: Preparar teste do GEROT para Node
        shell: bash
        run: |
          cat > tests/gerot-entrega.test.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const { IMPORTED_GEROT_AREAS } = await import('../assets/js/gerot-imports.js');
          const modulePath = new URL('../assets/js/modules/index.js', import.meta.url);
          const source = await fs.readFile(modulePath, 'utf8');
          const isolated = source.replace(
            "import {anomalyReportsView} from '../anomaly-ui.js';",
            "const anomalyReportsView = () => '';"
          );
          const tempModule = path.join(os.tmpdir(), `gerot-module-test-${Date.now()}.mjs`);
          await fs.writeFile(tempModule, isolated);
          const { gerotLivePreview } = await import(pathToFileURL(tempModule).href);
          await fs.unlink(tempModule).catch(() => {});

          const area = IMPORTED_GEROT_AREAS.find((item) => item.area === 'ENTREGA');
          assert(area, 'GEROT ENTREGA não encontrado');
          const bySheet = new Map(area.rows.map((row) => [Number(row.sheetRow), row]));
          assert.equal(bySheet.get(8)?.indicator, 'DIAS ÚTEIS');
          assert.equal(bySheet.get(8)?.formulas?.filter(Boolean).length, 0);
          assert.equal(bySheet.get(16)?.formulas?.[0], '35*O8');
          assert.equal(bySheet.get(17)?.formulas?.[0], 'O16*2');
          assert.equal(bySheet.get(11)?.formulas?.[0], 'IFERROR(O18/O19,"")');

          let preview = new Map(gerotLivePreview(area).map((row) => [row.id, row]));
          assert(Math.abs(preview.get('entrega-11').monthly[0].value - (108 / 2730)) < 1e-12, 'IV crítico JAN incorreto');
          assert(Math.abs(preview.get('entrega-11').monthly[6].value - (259 / 2835)) < 1e-12, 'IV crítico JUL incorreto');
          assert.equal(preview.get('entrega-11').monthly[8].value, null, 'Mês sem preenchimento não pode virar 0%');

          preview = new Map(gerotLivePreview(area, {
            'entrega-8': { 7: 26 },
            'entrega-14': { 7: 10 },
            'entrega-15': { 7: 20 }
          }).map((row) => [row.id, row]));
          assert.equal(preview.get('entrega-16').monthly[7].value, 910, 'TT Motorista não recalculou pelos dias úteis');
          assert.equal(preview.get('entrega-17').monthly[7].value, 1820, 'TT Ajudante não recalculou');
          assert.equal(preview.get('entrega-18').monthly[7].value, 30, 'TT Atrasos não recalculou');
          assert.equal(preview.get('entrega-19').monthly[7].value, 2730, 'TT Funcionários não recalculou');
          assert(Math.abs(preview.get('entrega-11').monthly[7].value - (30 / 2730)) < 1e-12, 'IV crítico não recalculou automaticamente');
          console.log('GEROT ENTREGA: IV crítico, células vazias e fórmulas automáticas validados');
          NODE

      - name: Validar GEROT e regressões existentes
        run: |
          node --check assets/js/app.js
          node --check assets/js/modules/index.js
          node --check assets/js/api.js
          node tests/gerot-entrega.test.mjs
          npm run build
          node scripts/test-dto.mjs
          node tests/action-owner.test.mjs
          node tests/database-storage.test.mjs
          node tests/anomaly-items.test.mjs
          node --check dist/server/index.js

      - name: Publicar alterações no repositório
        run: |
          git config user.name "gabrielysilva27-commits"
          git config user.email "gabrielysilva27@icloud.com"
          git add assets/js/gerot-imports.js assets/js/modules/index.js assets/js/app.js assets/js/api.js assets/css/styles.css recovered/runtime.js tests/gerot-entrega.test.mjs .github/workflows/deploy-worker.yml
          git commit -m "Melhora editor GEROT e corrige IV crítico"
          git push origin main
          echo "PATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Confirmar publicação real no Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lead-gestao.gabrielysilva27.workers.dev"
          confirmed=0
          for n in $(seq 1 72); do
            nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${n}"
            app_code="$(curl -L -sS --connect-timeout 10 --max-time 25 -o /tmp/app.js -w '%{http_code}' "$BASE/assets/js/app.js?verify=$nonce" || true)"
            mod_code="$(curl -L -sS --connect-timeout 10 --max-time 25 -o /tmp/modules.js -w '%{http_code}' "$BASE/assets/js/modules/index.js?verify=$nonce" || true)"
            css_code="$(curl -L -sS --connect-timeout 10 --max-time 25 -o /tmp/styles.css -w '%{http_code}' "$BASE/assets/css/styles.css?verify=$nonce" || true)"
            gerot_code="$(curl -L -sS --connect-timeout 10 --max-time 25 -o /tmp/gerot.js -w '%{http_code}' "$BASE/assets/js/gerot-imports.js?verify=$nonce" || true)"
            if [ "$app_code" = "200" ] && [ "$mod_code" = "200" ] && [ "$css_code" = "200" ] && [ "$gerot_code" = "200" ] \
              && grep -q 'GEROT_SHEET_EDITOR_V2_20260906' /tmp/app.js \
              && grep -q 'GEROT_FORMULA_ENGINE_V2_20260906' /tmp/modules.js \
              && grep -q 'GEROT SHEET EDITOR V2 20260906' /tmp/styles.css \
              && grep -q 'EOY 2024' /tmp/app.js \
              && grep -q '"id":"entrega-8"' /tmp/gerot.js; then
              shared_code="$(curl -L -sS --connect-timeout 10 --max-time 25 -o /tmp/shared.json -w '%{http_code}' "$BASE/api/shared-view?verify=$nonce" || true)"
              if [ "$shared_code" = "200" ] && node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/shared.json', 'utf8'));
          const area = payload?.data?.gerotAdditionalAreas?.ENTREGA;
          if (!area || !Array.isArray(area.rows)) process.exit(1);
          const byRow = new Map(area.rows.map((row) => [Number(row.sheetRow), row]));
          if (byRow.get(8)?.indicator !== 'DIAS ÚTEIS') process.exit(1);
          if (byRow.get(16)?.formulas?.[0] !== '35*O8') process.exit(1);
          if (byRow.get(17)?.formulas?.[0] !== 'O16*2') process.exit(1);
          if (byRow.get(11)?.formulas?.[0] !== 'IFERROR(O18/O19,"")') process.exit(1);
          console.log('SHARED_IV_CRITICO_OK');
          NODE
              then
                confirmed=1
                echo "LIVE_GEROT_EDITOR_OK: editor em formato de planilha publicado; DIAS ÚTEIS e cadeia do IV crítico confirmados no compartilhamento."
                break
              fi
            fi
            echo "Aguardando deploy do editor GEROT - tentativa $n"
            sleep 5
          done
          test "$confirmed" -eq 1

      - name: Remover aplicador temporário
        if: success()
        run: |
          set -euo pipefail
          git config user.name "gabrielysilva27-commits"
          git config user.email "gabrielysilva27@icloud.com"
          git pull --rebase origin main
          rm -f scripts/patch-gerot-sheet-editor.mjs .github/workflows/gerot-sheet-editor-once.yml
          git add -A
          git commit -m "Remove aplicador temporário do editor GEROT"
          git push origin main
