name: Publicar LEAD no Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lead-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter versão publicada
        uses: actions/checkout@v6

      - name: Publicar Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          preCommands: npm run build && node tests/performance-optimization.test.mjs && node --test tests/gerot-delivery.test.mjs tests/gerot-delivery-server.test.mjs tests/gerot-delivery-route.test.mjs tests/gerot-pillar-save.test.mjs && node tests/gerot-entrega.test.mjs && node scripts/test-dto.mjs && node tests/action-owner.test.mjs && node tests/database-storage.test.mjs && node tests/anomaly-items.test.mjs && node --check assets/js/shared-api.js && node --check assets/js/performance-optimizer.js && node --check assets/js/lazy-features.js && node --check assets/js/gerot-delivery-launcher.js && node --check assets/js/gerot-delivery-editor.js && node --check dist/server/index.js
