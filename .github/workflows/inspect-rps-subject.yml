name: Test RPS Distribuição Ocupação
on:
  push:
    branches:
      - fix/rps-distribuicao-ocupacao-20260915
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build e regressão
        run: |
          npm run build
          node --check dist/server/index.js
          node --test tests/publication-performance.test.mjs tests/database-storage.test.mjs
      - name: Validar cadastro e migração automática
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'RPS_DISTRIBUICAO_OCUPACAO_V1' dist/server/index.js
          grep -q 'Cx Viagem FF e Spot.*Ocupação' dist/server/index.js
          grep -q 'var meetingSubjectSeedVersion = 3' dist/server/index.js
          grep -q 'await this.ensureMeetingSubjects(); await prepareReviewedActionImport(state)' dist/server/index.js
          grep -q 'this.applyMeetingSubjects(body.data)' dist/server/index.js
