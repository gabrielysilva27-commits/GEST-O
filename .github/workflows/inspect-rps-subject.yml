name: Inspect current shared store
on:
  push:
    branches:
      - fix/rps-distribuicao-ocupacao-20260915
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build anterior ao patch RPS e inspecionar
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-central-password-reset.mjs
          node scripts/disambiguate-password-reset-notification.mjs
          node scripts/preserve-local-password-reset.mjs
          node scripts/apply-action-opening-d0.mjs
          node scripts/apply-actions-performance.mjs
          node scripts/build-recovered.mjs
          node scripts/apply-apt-action-import-20260914.mjs
          echo '=== shared-sync ==='
          grep -n -B20 -A45 'sourcePath === "/shared-sync"' dist/server/index.js || true
          echo '=== shared-data occurrences ==='
          grep -n -B8 -A25 'storage.get("shared-data")' dist/server/index.js | head -160 || true
