name: Debug generated worker
on:
  push:
    branches:
      - debug/password-reset-deploy-20260915
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          node --test tests/publication-performance.test.mjs || true
          grep -n -B4 -A10 'liveNotifications' dist/server/index.js | head -120
      - uses: actions/upload-artifact@v4
        with:
          name: generated-worker
          path: dist/server/index.js
          retention-days: 1
