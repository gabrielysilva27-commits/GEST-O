name: Export temporary action import review data

on:
  push:
    branches:
      - chatgpt-extract-action-data-20260914

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Show requested user references
        shell: bash
        run: |
          grep -niE 'Lucas Soares|Christofee|Tiago Silva|Nathan|Iago' public/assets/js/api.js | head -80 || true
      - name: Upload review inputs
        uses: actions/upload-artifact@v4
        with:
          name: action-import-review-inputs
          path: |
            worker/action-import-20260914-data.js
            public/assets/js/api.js
          retention-days: 1
